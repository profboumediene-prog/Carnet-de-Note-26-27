<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#19223A">
<title>دفتر التنقيط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: Arabic RTL grade register in one deliberate dark navy look (the teacher's
   reference app): tile home, one card per student, floating cloud-save button. */
:root{
  color-scheme:dark;
  --bg:#0E1424; --bar:#19223A; --panel:#172035; --card:#1C2539; --field:#0E1526;
  --line:#2C3851; --line-2:#3C4B6B; --text:#EEF2F9; --muted:#93A0B9; --dim:#5F6B86;
  --blue:#5AB2F0; --blue-2:#2E7CC4; --green:#55B98A; --green-ink:#0B2318;
  --red:#F27373; --amber:#F2B04B; --purple:#A57CF3; --teal:#4CC2C6; --pink:#EE6AA7;
  --f:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{flex:none}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bar);border-bottom:1px solid var(--line)}
.bar .wrap{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding-block:12px}
.bar h1{margin:0;font-size:21px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border:0;background:transparent;color:var(--blue);display:grid;place-items:center;border-radius:12px}
.back:active{background:var(--panel)}
.back{grid-column:1;grid-row:1} .bar h1{grid-column:2;grid-row:1} .sync{grid-column:3;grid-row:1}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.ok i{background:var(--green)} .sync.wait i{background:var(--blue);animation:pulse 1s infinite alternate}
.sync.warn i,.sync.local i{background:var(--amber)}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync.wait i{animation:none}}

main .wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}

/* home */
.hero{display:flex;flex-direction:column;gap:2px;padding:4px 2px}
.hero .t{font-size:26px;font-weight:800;line-height:1.3}
.hero .s{color:var(--muted);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{--c:var(--blue);position:relative;border:1px solid color-mix(in srgb,var(--c) 32%,transparent);border-radius:26px;padding:22px 12px 18px;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%),var(--panel);
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:168px;justify-content:center}
.tile:active{transform:scale(.98)}
.tile .ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 22%,var(--panel));box-shadow:0 0 28px color-mix(in srgb,var(--c) 30%,transparent)}
.tile .lb{font-size:19px;font-weight:800;line-height:1.35}
.tile .hn{font-size:12px;color:var(--muted);margin-top:-8px}
.t-blue{--c:var(--blue)} .t-green{--c:var(--green)} .t-amber{--c:var(--amber)} .t-teal{--c:var(--teal)} .t-purple{--c:var(--purple)} .t-pink{--c:var(--pink)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.sec-h h2{margin:0;font-size:18px;font-weight:800}
.myc{display:flex;flex-direction:column;gap:10px}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start}
.crow .code{font-size:22px;font-weight:800;min-width:54px;text-align:center}
.crow .mid{min-width:0;display:flex;flex-direction:column;gap:6px}
.crow .lbl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.prog{height:6px;border-radius:999px;background:var(--field);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px}
.crow .side{text-align:center;min-width:64px}
.crow .side b{display:block;font-size:18px;font-weight:800}
.crow .side span{font-size:11.5px;color:var(--muted)}

/* panels, selects */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dd{position:relative;min-width:0}
.dd-b{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--field);border:1.5px solid var(--blue-2);border-radius:14px;padding:10px 14px;font-size:18px;font-weight:700;text-align:start}
.dd-b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-b svg{color:var(--blue)}
.dd-m{position:absolute;top:calc(100% + 6px);inset-inline:0;z-index:7;background:var(--bar);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.45);overflow:hidden;max-height:60vh;overflow-y:auto}
.dd-m button{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:10px;border:0;background:transparent;padding:12px 16px;font-size:18px;font-weight:700;text-align:start}
.dd-m button small{font-size:12px;color:var(--muted);font-weight:500;direction:ltr}
.dd-m button.on{background:var(--line)}
.dd-m button:active{background:var(--line-2)}
.search{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:0 16px}
.search svg{color:var(--blue)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:14px 0;font-size:17px}
.search input::placeholder{color:var(--dim)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--blue-2)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:14.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--blue-2);color:#fff}
.row-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.switch i{width:30px;height:18px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:right .15s}
.switch[aria-pressed="true"]{color:var(--text)}
.switch[aria-pressed="true"] i{background:var(--blue-2)}
.switch[aria-pressed="true"] i::after{right:14px}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:20px;font-weight:800;line-height:1.3}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:600}
.low{color:var(--red)!important}
.prov{color:var(--amber)}

/* student card */
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.card.open{border-color:var(--line-2)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-h h3{margin:0;font-size:21px;font-weight:800;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.card-h .no{color:var(--text)}
.st{font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding-top:6px}
.st i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.st.ok i{background:var(--green)} .st.part i{background:var(--amber)}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.15fr);gap:8px;align-items:end}
.bx{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bl{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.bv{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);text-align:center;font-size:22px;font-weight:800;color:var(--text);padding:0 2px;font-variant-numeric:tabular-nums}
.bv::placeholder{color:var(--line-2);font-weight:500}
input.bv:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
.bv.bad{border-color:var(--red);color:var(--red)}
.bv.calc{position:relative;display:grid;place-items:center;border-style:dashed;border-color:var(--line-2)}
.bv.calc.full{border-style:solid;border-color:var(--line)}
.bv.calc .part{color:var(--amber);font-size:18px}
.bv.calc::after{content:"";position:absolute;bottom:5px;left:50%;width:7px;height:7px;border-left:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:translateX(-50%) rotate(-45deg);opacity:.8}
.bv.calc[aria-expanded="true"]{border-color:var(--blue);border-style:solid}
.bv.calc[aria-expanded="true"]::after{transform:translateX(-50%) rotate(135deg);bottom:3px}
.avgx .av{height:52px;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.det{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line-2);padding-top:12px}
.dg{display:flex;flex-direction:column;gap:6px}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:700}
.dh b{font-size:15px;font-weight:800;color:var(--blue)}
.dh b small{color:var(--muted);font-weight:600}
.subs{display:grid;gap:8px}
.s4{grid-template-columns:repeat(4,minmax(0,1fr))} .s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.sl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.sl em{font-style:normal;color:var(--dim)}
.bv.sm{height:46px;font-size:20px}
.rm{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--field);padding:10px 12px;font-size:15px}
.rm:focus{outline:none;border-color:var(--blue)}
.rm::placeholder{color:var(--dim)}

/* quick entry */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 12px;font-size:14.5px;font-weight:700;display:inline-flex;gap:4px;align-items:baseline}
.chip em{font-style:normal;font-size:12px;color:var(--muted)}
.chip.done{border-color:color-mix(in srgb,var(--green) 60%,transparent)}
.chip[aria-pressed="true"]{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.chip[aria-pressed="true"] em{color:#dfe9ff}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.qbar b{color:var(--text)}
.qlist{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 84px 70px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qn{font-size:17px;font-weight:700;overflow-wrap:anywhere;line-height:1.4}
.qrow .bv{height:46px;font-size:20px}
.qa{font-size:17px;font-weight:800;color:var(--blue);text-align:center;font-variant-numeric:tabular-nums}
.qa:empty::before{content:"—";color:var(--line-2);font-weight:500}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:center;white-space:nowrap}
thead th{background:var(--bar);font-weight:800;font-size:14px;color:var(--muted)}
td.nm,th.nm{text-align:right;font-weight:700;position:sticky;right:0;background:var(--card);border-left:1px solid var(--line)}
thead th.nm{background:var(--bar)}
td.v{font-variant-numeric:tabular-nums;font-weight:600}
td.avg{font-weight:800;color:var(--blue)}
td.rk{font-size:13.5px;color:var(--muted)}
tbody tr{cursor:pointer}
tbody tr:active td{background:var(--panel)}
tfoot td{font-weight:800;background:var(--bar)}
tfoot td.nm{background:var(--bar)}

/* stats */
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.kg .l{font-size:12.5px;color:var(--muted)}
.kg .v{font-size:28px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.kg .v small{font-size:15px;color:var(--muted);font-weight:600}
.kg .x{font-size:12px;color:var(--muted)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chart h3{margin:0;font-size:16px;font-weight:800}
.chart .sub{font-size:12.5px;color:var(--muted);margin-top:-8px}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:10px;align-items:center;border:0;background:transparent;padding:2px 0;text-align:start;border-radius:8px}
.brow .bl2{font-size:13.5px;font-weight:600;white-space:nowrap}
.track{height:18px;background:var(--field);border-radius:4px;overflow:hidden;position:relative}
.track i{position:absolute;top:0;bottom:0;right:0;background:var(--blue);border-radius:4px}
.track i.crit{background:var(--red)}
.brow .bv2{font-size:14px;font-weight:800;text-align:left;font-variant-numeric:tabular-nums}
.brow[aria-pressed="true"] .bl2{color:var(--blue)}
.brow[aria-pressed="true"] .track{outline:2px solid var(--blue);outline-offset:1px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:13.5px}
.names span b{font-weight:800;margin-inline-start:6px;font-variant-numeric:tabular-nums}
.rank{display:flex;flex-direction:column}
.rank div{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.rank div:first-child{border-top:0}
.rank .n{font-weight:800;color:var(--muted);text-align:center}
.rank .a{font-weight:800;font-variant-numeric:tabular-nums}

/* forms, lists */
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700}
.btn.pri{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent);background:transparent}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .n{color:var(--muted);font-weight:700;text-align:center}
.nm-in{width:100%;border:1px solid transparent;border-radius:10px;background:transparent;padding:8px;font-size:16.5px;font-weight:700}
.nm-in:focus{outline:none;border-color:var(--blue);background:var(--field)}
.addrow{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel)}
.txt{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:var(--field);padding:11px 14px;font-size:16px}
.txt:focus{outline:none;border-color:var(--blue)}
textarea.txt{min-height:200px;resize:vertical;line-height:1.7}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:600}
.confirm{display:flex;gap:6px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:56px 12px;font-size:19px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty small{font-size:14px}
.doc{display:flex;flex-direction:column;gap:12px}
.doc .f{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-weight:800;text-align:center;line-height:1.8}
.doc .f span{color:var(--blue)}
.doc table{min-width:0}
.doc td,.doc th{white-space:normal}
.xl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.xl .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px}
.xl .btn b{font-size:20px}
.xl .btn small{font-size:12px;color:var(--muted);font-weight:600}

/* floating save + toast */
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;
  display:inline-flex;align-items:center;gap:10px;border:0;border-radius:22px;padding:14px 22px;background:var(--green);color:var(--green-ink);
  font-size:19px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fab:active{transform:scale(.97)}
.fab.busy{opacity:.8}
.typing .fab{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:20;background:#fff;color:#14203A;
  padding:14px 18px;border-radius:16px;font-size:15.5px;font-weight:600;max-width:min(92vw,460px);box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}

.warn-b{background:color-mix(in srgb,var(--amber) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
@media (max-width:370px){
  .bv{font-size:19px;height:48px} .avgx .av{font-size:20px} .bl{font-size:12.5px}
  .card-h h3{font-size:19px} .tile .lb{font-size:17px} .s4{gap:6px}
  .brow{grid-template-columns:84px minmax(0,1fr) 48px}
}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="bar"><div class="wrap">
    <button class="back" id="back" type="button" aria-label="رجوع" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <h1 id="ttl">دفتر التنقيط</h1>
    <button class="sync wait" id="sync" type="button"><i></i><span>جارٍ الاتصال…</span></button>

/* ---------- cloud ---------- */
async function initCloud(){
  const [db, user] = await Promise.all([use('db'), use('user')]);
  const uid = user ? await user.id() : null;
  if (!db || !uid){ S.sync = 'local'; S.loaded = true; updateStatus(); render(); return; }
  if (S.uid && S.uid !== uid){ S.classes = {}; S.meta = null; S.dirty.clear(); }
  S.uid = uid;
  S.col = db.collection('data/users/' + uid);
  S.sync = 'cloud';
  subscribe();
}
function subscribe(){
  S.col.onSnapshot(onSnap, err => {
    if (err && err.code === 'unavailable'){ setTimeout(subscribe, 5000); return; }
    S.sync = 'local'; S.loaded = true; updateStatus(); render();
  });
}
function onSnap(snap){
  let changed = false;
  const seen = new Set();
  for (const d of snap.docs){
    const body = d.data(); if (!body) continue;
    seen.add(d.id);
    if (body.kind === 'meta'){
      if (JSON.stringify(body) !== JSON.stringify(S.meta)){ S.meta = JSON.parse(JSON.stringify(body)); changed = true; }
      continue;
    }
    if (body.kind !== 'class') continue;
    const loc = S.classes[d.id];
    if (S.dirty.has(d.id)){
      if (!loc) continue;
      if ((loc.u || 0) >= (body.u || 0)) continue;
    }
    if (loc && loc.u === body.u) continue;
    S.classes[d.id] = Object.assign(JSON.parse(JSON.stringify(body)), {id: d.id});
    S.dirty.delete(d.id);
    changed = true;
  }
  if (!snap.metadata.fromCache){
    for (const id of Object.keys(S.classes)){
      if (!seen.has(id) && !S.dirty.has(id)){ delete S.classes[id]; changed = true; }
    }
    for (const id of S.dirty) schedule(id, 300);
    if (!S.loaded){ S.loaded = true; changed = true; }
  }
  updateStatus();
  if (changed){ saveCache(); if (!isTyping()) render(); else S.pendingRender = true; }
}
const isTyping = () => { const a = document.activeElement; return !!(a && a.matches && a.matches('input,textarea')); };
window.addEventListener('online', () => { for (const id of S.dirty) schedule(id, 300); });

/* ---------- stats ---------- */
function stats(cls, tri = S.tri){
  const rs = cls.students.map(s => compute(G(cls, s.id, tri)));
  const fin = rs.filter(r => r.complete).map(r => r.avg);
  const base = fin.length ? fin : rs.filter(r => r.avg !== null).map(r => r.avg);
  return {n: rs.length, rs, fin, provisional: !fin.length && base.length > 0, base, mean: mean(base),
    pass: base.filter(v => v >= 10).length, cnt: base.length,
    max: base.length ? Math.max(...base) : null, min: base.length ? Math.min(...base) : null};
}

/* ---------- shared pieces ---------- */
function selectsHTML(){
  const cls = curClass(), list = sorted();
  const triMenu = S.dd === 'tri' ? `<div class="dd-m" role="listbox">${Object.entries(TRI).map(([k, v]) => `<button type="button" data-tri="${k}" class="${k === S.tri ? 'on' : ''}">${v}</button>`).join('')}</div>` : '';
  const clsMenu = S.dd === 'cls' ? `<div class="dd-m" role="listbox">${list.map(c => `<button type="button" data-cls="${esc(c.id)}" class="${c.id === S.cur ? 'on' : ''}"><span>${esc(c.code)}</span><small>${esc(c.short || '')} · ${c.students.length}</small></button>`).join('')}</div>` : '';
  return `<div class="panel selects">
    <div class="dd"><button type="button" class="dd-b" data-dd="tri" aria-expanded="${S.dd === 'tri'}"><span>${TRI[S.tri]}</span>${CHEV}</button>${triMenu}</div>
    <div class="dd"><button type="button" class="dd-b" data-dd="cls" aria-expanded="${S.dd === 'cls'}"><span>${cls ? esc(cls.code) : 'اختر القسم'}</span>${CHEV}</button>${clsMenu}</div>
  </div>`;
}
function kpisHTML(cls){
  const st = stats(cls);
  return `<div class="kpi"><div class="l">معدل القسم${st.provisional ? ' (مؤقت)' : ''}</div><div class="v ${st.mean !== null && st.mean < 10 ? 'low' : ''} ${st.provisional ? 'prov' : ''}">${st.mean === null ? '—' : fmtAvg(st.mean)}</div></div>
    <div class="kpi"><div class="l">المعدل ≥ 10</div><div class="v">${st.cnt ? st.pass : '—'}<small>${st.cnt ? ' / ' + st.cnt : ''}</small></div></div>
    <div class="kpi"><div class="l">بطاقات مكتملة</div><div class="v">${st.fin.length}<small> / ${st.n}</small></div></div>`;
}
const noClass = () => `<div class="empty">لا توجد بيانات للعرض<small>اختر القسم أو أضف قسماً من «قوائم الأقسام».</small></div>`;

function visible(cls){
  const q = norm(S.q);
  return cls.students.map((s, i) => ({s, i})).filter(({s, i}) => !q || norm(s.n).includes(q) || String(i + 1) === q);
}
function avgHTML(r){
  if (r.avg === null) return '';
  return `<span dir="ltr" class="${r.avg < 10 ? 'low' : ''} ${r.complete ? '' : 'prov'}">${r.complete ? '' : '≈'}${fmtAvg(r.avg)}</span>`;
}
function stHTML(r){
  if (r.complete) return {c:'ok', h:'<i></i>مكتمل'};
  if (r.filled) return {c:'part', h:`<i></i>ناقص ${8 - r.filled}`};
  return {c:'', h:''};
}
function calcVal(P){
  if (P.full) return fmtN(P.sum);
  if (P.n) return `<span class="part">${fmtN(P.sum)}…</span>`;
  return '';
}
function inAttrs(cls, s, i, k){
  const f = FMAP[k], v = G(cls, s.id)[k];
  return `id="in-${esc(s.id)}-${k}" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" autocorrect="off" spellcheck="false" dir="ltr"
    data-sid="${esc(s.id)}" data-k="${k}" data-ord="${i * 20 + f.o}" value="${isNum(v) ? fmtN(v) : ''}" aria-label="${esc(s.n)} — ${f.ar} على ${f.max}"`;
}

function installHTML(){
  if (!IS_PWA || isStandalone()) return '';
  if (S.installEvt) return `<div class="actions" style="margin-top:10px"><button type="button" class="btn green" data-act="install">تثبيت التطبيق على الهاتف</button></div>`;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) return `<p class="note">للتثبيت على iPhone: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</p>`;
  return `<p class="note">للتثبيت: قائمة المتصفح ⋮ ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p>`;
}

    <div class="seg" role="group" aria-label="طريقة الإدخال">
      <button type="button" data-view="cards" aria-pressed="${S.view === 'cards'}">بطاقات التلاميذ</button>
      <button type="button" data-view="quick" aria-pressed="${S.view === 'quick'}">إدخال سريع حسب العمود</button>
    </div>
    <div class="kpis" id="kpis">${kpisHTML(cls)}</div>`;

}
function cardHTML(cls, s, i){
  const g = G(cls, s.id), r = compute(g), st = stHTML(r);
  const open = S.detailAll || S.open.has(s.id);
  const sid = esc(s.id);
  return `<article class="card ${open ? 'open' : ''}" id="card-${sid}">
    <div class="card-h"><h3><span class="no num">${i + 1}-</span> ${esc(s.n)}</h3><span class="st ${st.c}" id="st-${sid}">${st.h}</span></div>
    <div class="boxes">
      <div class="bx"><span class="bl">تقويم</span><button type="button" class="bv calc ${r.mmP.full ? 'full' : ''}" id="bx-mm-${sid}" data-toggle="${sid}" data-first="c" aria-expanded="${open}" aria-label="التقويم المستمر — التفاصيل">${calcVal(r.mmP)}</button></div>
      <div class="bx"><span class="bl">أ.ت</span><button type="button" class="bv calc ${r.atP.full ? 'full' : ''}" id="bx-at-${sid}" data-toggle="${sid}" data-first="t1" aria-expanded="${open}" aria-label="الأعمال التطبيقية — التفاصيل">${calcVal(r.atP)}</button></div>
      <div class="bx"><span class="bl">فرض</span><input class="bv" ${inAttrs(cls, s, i, 'f')}></div>
      <div class="bx"><span class="bl">اختبار</span><input class="bv" ${inAttrs(cls, s, i, 'e')}></div>
      <div class="bx avgx"><span class="bl">المعدل</span><span class="av" id="av-${sid}">${avgHTML(r)}</span></div>
    </div>
    ${open ? `<div class="det">
      <div class="dg"><div class="dh"><span>التقويم المستمر</span><b id="mm-${sid}">${totHTML(r.mmP)}</b></div>
        <div class="subs s4">${['c','p','pr','a'].map(k => subHTML(cls, s, i, k)).join('')}</div></div>
      <div class="dg"><div class="dh"><span>الأعمال التطبيقية (شفهي وكتابي)</span><b id="at-${sid}">${totHTML(r.atP)}</b></div>
        <div class="subs s2">${['t1','t2'].map(k => subHTML(cls, s, i, k)).join('')}</div></div>
      <input class="rm" id="in-${sid}-r" type="text" data-sid="${sid}" data-k="r" enterkeyhint="next" value="${esc(g.r || '')}" placeholder="الملاحظة: ${esc(r.complete ? appreciation(r.avg) : 'تلقائية حسب المعدل')}">
    </div>` : ''}
  </article>`;
}
const totHTML = P => P.n ? `${fmtN(P.sum)} <small>/ 20${P.full ? '' : ' · ناقص'}</small>` : `— <small>/ 20</small>`;
function subHTML(cls, s, i, k){
  const f = FMAP[k];
  return `<label class="sb"><span class="sl">${f.sh} <em>/${f.max}</em></span><input class="bv sm" ${inAttrs(cls, s, i, k)}></label>`;
}

function quickHTML(cls, vis){
  const f = FMAP[S.field];
  const filled = cls.students.filter(s => isNum(G(cls, s.id)[f.k])).length;
  const done = k => cls.students.length && cls.students.every(s => isNum(G(cls, s.id)[k]));
  const fill = (f.k === 'pr' || f.k === 'a') && filled < cls.students.length
    ? `<button type="button" class="btn sm" data-act="fill" data-k="${f.k}">وضع ${f.max} للخانات الفارغة</button>` : '';
  return `
    <div class="chips">${FIELDS.map(x => `<button type="button" class="chip ${done(x.k) ? 'done' : ''}" data-field="${x.k}" aria-pressed="${S.field === x.k}">${x.sh}<em>/${x.max}</em></button>`).join('')}</div>
    <div class="qbar"><span><b>${f.ar}</b> على ${f.max} · <span id="qprog" class="num">${filled} / ${cls.students.length}</span> مُدخلة</span>${fill}</div>
    <div class="qlist">${vis.map(({s, i}) => `<div class="qrow">
      <span class="qn"><span class="num">${i + 1}-</span> ${esc(s.n)}</span>
      <input class="bv" ${inAttrs(cls, s, i, f.k)}>
      <span class="qa" id="av-${esc(s.id)}">${avgHTML(compute(G(cls, s.id)))}</span>
    </div>`).join('')}</div>`;
}

  const col = k => fmtAvg(mean(st.rs.map(r => r[k]).filter(isNum)));
  return `${selectsHTML()}
    <div class="tbl-wrap" dir="rtl"><table>
      <thead><tr><th>الرقم</th><th class="nm">الاسم واللقب</th><th>م م</th><th>أ.تط</th><th>الفرض</th><th>الاختبار</th><th>المعدل</th><th>الملاحظات</th></tr></thead>
      <tbody>${cls.students.map((s, i) => {
        const g = G(cls, s.id), r = st.rs[i];
        const part = P => P.full ? fmtN(P.sum) : P.n ? `<span class="prov">${fmtN(P.sum)}…</span>` : '';
        return `<tr data-row="${esc(s.id)}"><td class="v">${i + 1}</td><td class="nm">${esc(s.n)}</td><td class="v">${part(r.mmP)}</td><td class="v">${part(r.atP)}</td>

      }).join('')}</tbody>

}

const BANDS = [
  {lb:'أقل من 8', lo:0, hi:8, crit:true}, {lb:'8 – 9.99', lo:8, hi:10, crit:true},
  {lb:'10 – 11.99', lo:10, hi:12}, {lb:'12 – 13.99', lo:12, hi:14},
  {lb:'14 – 15.99', lo:14, hi:16}, {lb:'16 فما فوق', lo:16, hi:20.01},
];
function viewStats(){
  const cls = curClass();
  if (!cls) return selectsHTML() + noClass();
  const st = stats(cls);
  const pct = st.cnt ? Math.round(st.pass / st.cnt * 100) : null;
  const items = cls.students.map((s, i) => ({s, i, r: st.rs[i]})).filter(x => x.r.avg !== null && (st.provisional || x.r.complete));
  const counts = BANDS.map(b => items.filter(x => x.r.avg >= b.lo && x.r.avg < b.hi));
  const maxC = Math.max(1, ...counts.map(c => c.length));
  const band = S.band !== null && counts[S.band] ? counts[S.band] : null;
  const comp = [['mm','التقويم المستمر'],['at','الأعمال التطبيقية'],['f','الفرض'],['e','الاختبار']].map(([k, lb]) => ({lb, v: mean(st.rs.map(r => r[k]).filter(isNum))}));
  const top = items.slice().sort((a, b) => b.r.avg - a.r.avg).slice(0, 5);
  const weak = items.filter(x => x.r.avg < 10).sort((a, b) => a.r.avg - b.r.avg);
  const others = sorted().map(c => ({c, m: mean(stats(c).fin)}));
  return `${selectsHTML()}
    ${st.provisional ? `<p class="note">لا توجد بطاقة مكتملة بعد: الأرقام أدناه مؤقتة وتحسب النقاط المدخلة فقط.</p>` : ''}
    <div class="kgrid">
      <div class="kg"><div class="l">معدل القسم</div><div class="v ${st.mean !== null && st.mean < 10 ? 'low' : ''}">${st.mean === null ? '—' : fmtAvg(st.mean)}</div><div class="x">${st.cnt} تلميذ محسوب</div></div>
      <div class="kg"><div class="l">نسبة النجاح (≥ 10)</div><div class="v">${pct === null ? '—' : pct + '%'}</div><div class="x">${st.pass} من ${st.cnt}</div></div>
      <div class="kg"><div class="l">أعلى معدل</div><div class="v">${st.max === null ? '—' : fmtAvg(st.max)}</div><div class="x">${top[0] ? esc(top[0].s.n) : '&nbsp;'}</div></div>
      <div class="kg"><div class="l">أدنى معدل</div><div class="v ${st.min !== null && st.min < 10 ? 'low' : ''}">${st.min === null ? '—' : fmtAvg(st.min)}</div><div class="x">بطاقات مكتملة: ${st.fin.length} / ${st.n}</div></div>
    </div>
    <section class="chart"><h3>توزيع المعدلات</h3><div class="sub">عدد التلاميذ في كل فئة · المس فئة لعرض الأسماء</div>
      ${BANDS.map((b, k) => `<button type="button" class="brow" data-band="${k}" aria-pressed="${S.band === k}"><span class="bl2">${b.lb}</span><span class="track"><i class="${b.crit ? 'crit' : ''}" style="width:${counts[k].length / maxC * 100}%"></i></span><span class="bv2">${counts[k].length}</span></button>`).join('')}
      ${band ? `<div class="names">${band.length ? band.map(x => `<span>${esc(x.s.n)}<b class="${x.r.avg < 10 ? 'low' : ''}">${fmtAvg(x.r.avg)}</b></span>`).join('') : '<span>لا أحد في هذه الفئة</span>'}</div>` : ''}
      <div class="note">الأحمر = معدل دون 10</div>
    </section>
    <section class="chart"><h3>معدل كل عنصر من عناصر التقييم</h3><div class="sub">على 20</div>
      ${comp.map(c => `<div class="brow"><span class="bl2">${c.lb}</span><span class="track"><i style="width:${c.v === null ? 0 : c.v / 20 * 100}%"></i></span><span class="bv2">${c.v === null ? '—' : fmtAvg(c.v)}</span></div>`).join('')}
    </section>
    <section class="chart"><h3>الأوائل</h3>
      <div class="rank">${top.length ? top.map((x, k) => `<div><span class="n">${k + 1}</span><span>${esc(x.s.n)}</span><span class="a">${fmtAvg(x.r.avg)}</span></div>`).join('') : '<p class="note">لا توجد معدلات بعد.</p>'}</div>
    </section>
    <section class="chart"><h3>تلاميذ دون المعدل (${weak.length})</h3>
      ${weak.length ? `<div class="names">${weak.map(x => `<span>${esc(x.s.n)}<b class="low">${fmtAvg(x.r.avg)}</b></span>`).join('')}</div>` : '<p class="note">لا يوجد تلميذ دون 10.</p>'}
    </section>
    <section class="chart"><h3>مقارنة الأقسام · ${TRI[S.tri]}</h3><div class="sub">معدل كل قسم (البطاقات المكتملة) · المس قسماً لعرضه</div>
      ${others.map(o => `<button type="button" class="brow" data-cls="${esc(o.c.id)}" aria-pressed="${o.c.id === S.cur}"><span class="bl2">${esc(o.c.code)}</span><span class="track"><i class="${o.m !== null && o.m < 10 ? 'crit' : ''}" style="width:${o.m === null ? 0 : o.m / 20 * 100}%"></i></span><span class="bv2">${o.m === null ? '—' : fmtAvg(o.m)}</span></button>`).join('')}
    </section>`;
}

/* ---------- render ---------- */
function render(){
  S.pendingRender = false;
  const ae = document.activeElement;
  const fid = ae && ae.id && ae.matches && ae.matches('input,textarea') ? ae.id : null;
  let sel = null; try { sel = fid ? [ae.selectionStart, ae.selectionEnd] : null; } catch (e) {}

  const list = sorted();
  if (!S.classes[S.cur]) S.cur = list.length ? list[0].id : null;
  $('#ttl').textContent = TITLES[S.screen] || TITLES.home;
  $('#back').hidden = S.screen === 'home';
  $('#fab').hidden = S.screen !== 'entry' && S.screen !== 'lists';
  $('#fab-l').textContent = S.col ? 'حفظ السحابة' : 'حفظ';

  const v = {home: viewHome, entry: viewEntry, table: viewTable, stats: viewStats, export: viewExport, lists: viewLists, new: viewNew, bareme: viewBareme}[S.screen] || viewHome;
  $('#main').innerHTML = (!STORE_OK && (S.screen === 'home' || S.screen === 'entry') ? WARN : '') + (STRAY && S.screen !== 'export' ? STRAY_B : '') + v();
  updateStatus();

  if (fid){
    const el = document.getElementById(fid);
    if (el){ el.focus({preventScroll: true}); try { if (sel) el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  }
  if (S.scrollTo){
    const el = document.getElementById('card-' + S.scrollTo); S.scrollTo = null;
    if (el) el.scrollIntoView({block: 'start'});
  }
}
function go(screen){
  S.screen = screen; S.dd = null; S.confirm = null; S.band = null;
  saveCache(); render(); window.scrollTo({top: 0});
}

/* ---------- live refresh while typing ---------- */
function refreshLive(sid){
  const cls = curClass(); if (!cls) return;
  const r = compute(G(cls, sid)), st = stHTML(r);
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  set('av-' + sid, avgHTML(r));
  const se = document.getElementById('st-' + sid); if (se){ se.className = 'st ' + st.c; se.innerHTML = st.h; }
  const mmB = document.getElementById('bx-mm-' + sid); if (mmB){ mmB.innerHTML = calcVal(r.mmP); mmB.classList.toggle('full', r.mmP.full); }
  const atB = document.getElementById('bx-at-' + sid); if (atB){ atB.innerHTML = calcVal(r.atP); atB.classList.toggle('full', r.atP.full); }
  set('mm-' + sid, totHTML(r.mmP)); set('at-' + sid, totHTML(r.atP));
  const rm = document.getElementById('in-' + sid + '-r'); if (rm) rm.placeholder = 'الملاحظة: ' + (r.complete ? appreciation(r.avg) : 'تلقائية حسب المعدل');
  set('kpis', kpisHTML(cls));
  const qp = $('#qprog');
  if (qp){
    const k = S.field; qp.textContent = `${cls.students.filter(s => isNum(G(cls, s.id)[k])).length} / ${cls.students.length}`;
    const chip = document.querySelector(`.chip[data-field="${k}"]`);
    if (chip) chip.classList.toggle('done', cls.students.every(s => isNum(G(cls, s.id)[k])));
  }
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ S.q = t.value; render(); return; }
  if (!t.matches || !t.matches('input[data-k]')) return;
  const cls = curClass(); if (!cls) return;
  const {sid, k} = t.dataset;
  if (k === 'r'){
    const txt = t.value.trim(); const g = gradeObj(cls, sid);
    if (txt) g.r = txt; else delete g.r;
    touch(cls); return;
  }
  const f = FMAP[k]; const v = parseGrade(t.value, f.max);
  if (v === undefined){ t.classList.add('bad'); return; }
  t.classList.remove('bad');
  const old = G(cls, sid)[k];
  if ((v === null && old === undefined) || v === old) return;
  const g = gradeObj(cls, sid);
  if (v === null) delete g[k]; else g[k] = v;
  touch(cls);
  refreshLive(sid);
});
document.addEventListener('focusin', e => {
  if (e.target.matches && e.target.matches('input,textarea')) $('#app').classList.add('typing');
});
document.addEventListener('focusout', e => {
  const t = e.target;
  setTimeout(() => { if (!isTyping()){ $('#app').classList.remove('typing'); if (S.pendingRender) render(); } }, 120);
  if (t.matches && t.matches('input.bv.bad')){
    const cls = curClass(); const f = FMAP[t.dataset.k];
    const v = cls ? G(cls, t.dataset.sid)[t.dataset.k] : undefined;
    t.value = isNum(v) ? fmtN(v) : ''; t.classList.remove('bad');
    toast(`نقطة مرفوضة: أدخل عدداً بين 0 و ${f.max} (مثال: ${f.max === 3 ? '2.5' : '12.5'})`);
  }
  if (t.matches && t.matches('input[data-name]')){
    const cls = curClass(); if (!cls) return;
    const s = cls.students.find(x => x.id === t.dataset.name);
    const nv = t.value.trim().replace(/\s+/g, ' ');
    if (s && nv && nv !== s.n){ s.n = nv; touch(cls); }
    else if (s && !nv) t.value = s.n;
  }
});
function focusNext(t){
  const all = [...document.querySelectorAll('input[data-ord]')].filter(x => x.offsetParent !== null).sort((a, b) => a.dataset.ord - b.dataset.ord);
  const cur = t.dataset.ord !== undefined ? +t.dataset.ord : (() => { const c = t.closest('.card'); const any = c && c.querySelector('input[data-ord]'); return any ? Math.floor(any.dataset.ord / 20) * 20 + 19 : -1; })();
  const nx = all.find(x => +x.dataset.ord > cur);
  if (nx){ nx.focus(); try { nx.select(); } catch (e) {} nx.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  else t.blur();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.dd){ S.dd = null; render(); return; }
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'q'){ e.preventDefault(); t.blur(); return; }
  if (t.id === 'add-name'){ e.preventDefault(); addStudent(); return; }
  if (t.matches && t.matches('input[data-name]')){ e.preventDefault(); t.blur(); return; }
  if (t.matches && t.matches('input[data-k]')){ e.preventDefault(); focusNext(t); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'imp-file') return;
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const o = JSON.parse(await file.text());
    if (!o || o.app !== 'carnet-notes' || !o.classes || typeof o.classes !== 'object') throw new Error('format');
    const classes = Object.entries(o.classes).map(([id, c]) => Object.assign({}, c, {id: c && c.id || id}))
      .filter(c => c && Array.isArray(c.students) && /^[A-Za-z0-9_\-.~:@+]{1,60}$/.test(c.id));
    if (!classes.length) throw new Error('empty');
    let date = '';
    try { date = o.savedAt ? new Date(o.savedAt).toLocaleString('fr-FR', {dateStyle: 'short', timeStyle: 'short'}) : ''; } catch (x) {}
    S.imp = {classes, meta: o.meta || null, date};
    go('export');
  } catch (x) { toast('هذا الملف ليس نسخة احتياطية من دفتر التنقيط.'); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'newcls') return;
  e.preventDefault();
  const code = $('#nc-code').value.trim();
  if (!code){ toast('أدخل رمز القسم'); return; }
  const label = $('#nc-label').value.trim();
  const names = $('#nc-names').value.split(/\r?\n/).map(l => l.replace(/^[\s\d٠-٩.\-–)]+/, '').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const id = 'c' + Date.now().toString(36);
  const order = Math.max(0, ...Object.values(S.classes).map(c => c.order || 0)) + 1;
  const slug = (label || '').normalize('NFD').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || id;
  S.classes[id] = {id, kind:'class', code, label, short: (label.split('·')[0] || '').trim().slice(0, 10), slug, order,
    students: names.map((n, i) => ({id: 's' + String(i + 1).padStart(2, '0'), n})), t: {}, u: 0};
  S.cur = id;
  touch(S.classes[id]);
  toast(`تم إنشاء القسم ${code} (${names.length} تلميذ)`);
  go('lists');
});
function addStudent(){
  const cls = curClass(); const el = $('#add-name'); if (!cls || !el) return;
  const n = el.value.trim().replace(/\s+/g, ' ');
  if (!n){ el.focus(); return; }
  cls.students.push({id: 's' + Date.now().toString(36), n});
  touch(cls); render();
  const again = $('#add-name'); if (again) again.focus();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button,tr[data-row]');
  if (S.dd && !(b && (b.dataset.dd || b.closest('.dd-m')))){ S.dd = null; if (!b){ render(); return; } }
  if (!b) return;
  const d = b.dataset;
  if (b.id === 'back'){ go(S.screen === 'new' ? 'lists' : 'home'); return; }
  if (b.id === 'sync'){ explainSync(); return; }
  if (b.id === 'fab'){ saveNow(); return; }
  if (d.go){ go(d.go); return; }
  if (d.dd){ S.dd = S.dd === d.dd ? null : d.dd; render(); return; }
  if (d.tri){ S.tri = d.tri; S.dd = null; S.band = null; saveCache(); render(); return; }
  if (d.cls){ S.cur = d.cls; S.dd = null; S.open.clear(); S.q = ''; S.band = null; S.confirm = null; saveCache(); render(); return; }
  if (d.openClass){ S.cur = d.openClass; S.q = ''; S.open.clear(); go('entry'); return; }
  if (d.view){ S.view = d.view; saveCache(); render(); return; }
  if (d.field){ S.field = d.field; saveCache(); render(); return; }
  if (d.band !== undefined){ S.band = S.band === +d.band ? null : +d.band; render(); return; }
  if (d.row){ S.view = 'cards'; S.q = ''; S.open.add(d.row); S.scrollTo = d.row; S.screen = 'entry'; saveCache(); render(); return; }
  if (d.toggle){
    const sid = d.toggle;
    if (S.detailAll){ const el = document.getElementById(`in-${sid}-${d.first}`); if (el){ el.focus(); el.select(); } return; }
    const opening = !S.open.has(sid);
    if (opening) S.open.add(sid); else S.open.delete(sid);
    render();
    if (opening){ const el = document.getElementById(`in-${sid}-${d.first}`); if (el){ el.focus({preventScroll: true}); try { el.select(); } catch (x) {} } }
    return;
  }
  if (d.xlsx){ const c = S.classes[d.xlsx]; if (c) exportXlsx([c]); return; }
  const cls = curClass();
  switch (d.act){
    case 'detail-all': S.detailAll = !S.detailAll; saveCache(); render(); break;
    case 'fill': {
      if (!cls) break; const f = FMAP[d.k]; let n = 0;
      for (const s of cls.students){ if (!isNum(G(cls, s.id)[f.k])){ gradeObj(cls, s.id)[f.k] = f.max; n++; } }
      if (n){ touch(cls); render(); toast(`${f.ar}: وُضعت ${f.max}/${f.max} لـ ${n} تلميذ`); }
      break;
    }
    case 'add-stu': addStudent(); break;
    case 'ask-del-stu': S.confirm = {type:'stu', id: d.id}; render(); break;
    case 'ask-del-class': S.confirm = {type:'class'}; render(); break;
    case 'cancel': S.confirm = null; render(); break;
    case 'del-stu': {
      if (!cls) break;
      const s = cls.students.find(x => x.id === d.id);
      cls.students = cls.students.filter(x => x.id !== d.id);
      for (const t of Object.keys(cls.t || {})) if (cls.t[t]) delete cls.t[t][d.id];
      S.confirm = null; touch(cls); render();
      if (s) toast(`حُذف ${s.n} من القائمة`);
      break;
    }
    case 'del-class': {
      if (!cls) break;
      const code = cls.code;
      delete S.classes[cls.id]; S.dirty.add(cls.id); S.confirm = null; S.cur = null;
      saveCache(); schedule(cls.id, 100); render(); toast(`حُذف القسم ${code}`);
      break;
    }
    case 'xlsx-all': exportXlsx(sorted()); break;
    case 'backup': backupDownload(); break;
    case 'install': {
      const ev = S.installEvt; if (!ev) break;
      ev.prompt();
      (ev.userChoice || Promise.resolve()).then(() => { S.installEvt = null; render(); });
      break;
    }
    case 'imp-no': S.imp = null; render(); break;
    case 'imp-ok': {
      if (!S.imp) break;
      const list = S.imp.classes;
      for (const c of list){ const id = c.id; S.classes[id] = Object.assign(JSON.parse(JSON.stringify(c)), {id, kind:'class'}); touch(S.classes[id]); }
      if (!S.meta && S.imp.meta) S.meta = S.imp.meta;
      S.imp = null; saveCache(); render(); toast(`تم استرجاع ${list.length} أقسام ✓`);
      break;
    }
  }
});

function explainSync(){
  if (S.sync === 'local') toast(STORE_OK ? 'النقاط محفوظة في متصفح هذا الجهاز. احفظ نسخة احتياطية من «تصدير وحفظ» للاحتياط أو لنقلها إلى جهاز آخر.' : 'هذا المتصفح لا يحتفظ بالنقاط لهذا الملف. احفظ نسخة احتياطية قبل الإغلاق.');
  else if (S.dirty.size) toast('لا توجد شبكة الآن: النقاط محفوظة على الهاتف وستُرسل إلى السحابة عند عودة الاتصال.');
  else toast('كل النقاط محفوظة في حسابك، وتجدها على الهاتف والحاسوب.');
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}

/* ---------- files ---------- */
async function saveFile(name, blob){
  const dl = await use('downloads');
  if (dl){
    try { await dl.save({filename: name, data: blob}); return 'ok'; }
    catch (e) { const c = e && e.code; return c === 'declined' ? 'declined' : c === 'rate_limited' ? 'busy' : 'fail'; }
  }
  try {
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); return 'ok';
  } catch (e) { return 'fail'; }
}
const fileMsg = (r, okMsg) => { if (r === 'ok') toast(okMsg); else if (r === 'busy') toast('هناك طلب تنزيل مفتوح، أعد المحاولة بعد لحظة.'); else if (r !== 'declined') toast('تعذّر حفظ الملف في هذا العرض.'); };
async function backupDownload(){
  const d = new Date(), p2 = n => String(n).padStart(2, '0');

/* ---------- Excel (.xlsx written here, no library) ---------- */
function sheetFor(cls){
  const m = S.meta || {};
  const st = stats(cls);
  const v = x => isNum(x) ? x : '';
  const rows = [
    [m.school || ''],
    [`قائمة تنقيط التلاميذ قسم ${cls.code} - ${TRI[S.tri]} - اللغة الفرنسية`],
    [`الموسم الدراسي: ${m.year || ''}`, '', '', '', '', `الأستاذ: ${m.teacher || ''}`],
    [],
    ['الرقم','الاسم واللقب','م م','أ.تط','الفرض','الاختبار','المعدل','الملاحظات','','الكراس /8','المشاركة /6','الحضور /3','المواظبة /3','تطبيق 1 /10','تطبيق 2 /10'],
  ];
  cls.students.forEach((s, i) => {
    const g = G(cls, s.id), r = st.rs[i];
    rows.push([i + 1, s.n, v(r.mm), v(r.at), v(r.f), v(r.e), r.complete ? r.avg : '', g.r || (r.complete ? appreciation(r.avg) : ''), '',
      v(g.c), v(g.p), v(g.pr), v(g.a), v(g.t1), v(g.t2)]);
  });
  const col = k => { const a = mean(st.rs.map(r => r[k]).filter(isNum)); return a === null ? '' : a; };
  rows.push([]);
  const bold = [0, 1, 4, rows.length];
  rows.push(['', 'معدل القسم', col('mm'), col('at'), col('f'), col('e'), st.fin.length ? mean(st.fin) : '']);
  if (st.fin.length){ bold.push(rows.length); rows.push(['', 'نسبة النجاح (≥10)', '', '', '', '', `${st.fin.filter(x => x >= 10).length}/${st.fin.length}`]); }
  return {rows, bold, cols: [6, 28, 7, 7, 7, 9, 8, 16, 2, 9, 11, 9, 10, 10, 10], merges: ['A1:H1', 'A2:H2']};
}
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipBytes(files){
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;
  for (const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    cd.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  }
  const cdSize = cd.reduce((a, p) => a + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  const all = [...parts, ...cd, new Uint8Array(e.buffer)], out = new Uint8Array(all.reduce((a, p) => a + p.length, 0));
  let o = 0; for (const p of all){ out.set(p, o); o += p.length; }
  return out;
}
const xesc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const colL = n => { let s = ''; n++; while (n){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
const XH = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const NS = 'http://schemas.openxmlformats.org';
function sheetXML(sh){
  const rows = sh.rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
    if (v === '' || v === null || v === undefined) return '';
    const ref = colL(ci) + (ri + 1), s = sh.bold.includes(ri) ? ' s="1"' : '';
    return typeof v === 'number' ? `<c r="${ref}"${s}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
  }).join('')}</row>`).join('');
  const cols = sh.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  const merges = sh.merges.length ? `<mergeCells count="${sh.merges.length}">${sh.merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
  return `${XH}<worksheet xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols>${cols}</cols><sheetData>${rows}</sheetData>${merges}</worksheet>`;
}
function buildXlsx(sheets){
  const ct = `${XH}<Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
  const rels = `${XH}<Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wb = `${XH}<workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xesc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
  const wbr = `${XH}<Relationships xmlns="${NS}/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const st = `${XH}<styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  return zipBytes([{name: '[Content_Types].xml', data: ct}, {name: '_rels/.rels', data: rels}, {name: 'xl/workbook.xml', data: wb}, {name: 'xl/_rels/workbook.xml.rels', data: wbr}, {name: 'xl/styles.xml', data: st},
    ...sheets.map((s, i) => ({name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXML(s)}))]);
}
async function exportXlsx(list){
  if (!list.length) return;
  const used = new Set();
  const sheets = list.map(c => {
    const sh = sheetFor(c);
    let nm = String(c.code).replace(/[\[\]:*?\/\\]/g, '').slice(0, 31) || c.id;
    while (used.has(nm)) nm = nm.slice(0, 27) + '_' + used.size;
    used.add(nm); sh.name = nm; return sh;
  });
  const blob = new Blob([buildXlsx(sheets)], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const name = list.length === 1 ? `Notes_FR_T${S.tri}_${list[0].slug || list[0].id}.xlsx` : `Notes_FR_T${S.tri}_toutes_classes.xlsx`;
  fileMsg(await saveFile(name, blob), 'تم حفظ ملف Excel ✓');
}

window.addEventListener('appinstalled', () => { S.installEvt = null; toast('تم تثبيت التطبيق ✓'); if (S.screen === 'home') render(); });

/* ---------- boot ---------- */
let hadCache = false;
try { hadCache = !!localStorage.getItem(LS); } catch (e) {}
loadCache();
if (SEED && SEED.classes){
  const seedIds = new Set(Object.keys(SEED.classes));
  // first launch of this file: bring back notes typed in earlier offline copies on this device
  if (!hadCache){
    for (const key of ['carnet-notes-fichier-v1', 'carnet-notes-v1']){
      try {
        const o = JSON.parse(localStorage.getItem(key) || 'null');
        for (const [id, c] of Object.entries((o && o.classes) || {})){
          if (!c || !Array.isArray(c.students) || !c.students.length) continue;
          if (key === 'carnet-notes-v1' && !seedIds.has(id)) continue;
          if (!S.classes[id] || (c.u || 0) > (S.classes[id].u || 0)) S.classes[id] = Object.assign({}, c, {id});
        }
      } catch (e) {}
    }
  }
  for (const [id, c] of Object.entries(SEED.classes)){
    const cur = S.classes[id];
    if (!cur || !Array.isArray(cur.students) || !cur.students.length || (c.u || 0) > (cur.u || 0)) S.classes[id] = JSON.parse(JSON.stringify(Object.assign({}, c, {id})));
  }
  // drop empty leftovers that repeat one of the real classes
  const codes = new Set(Object.values(SEED.classes).map(c => norm(c.code)));
  for (const [id, c] of Object.entries(S.classes)){
    if (!seedIds.has(id) && (!Array.isArray(c.students) || !c.students.length) && codes.has(norm(c.code))) delete S.classes[id];
  }
  if (!S.meta && SEED.meta) S.meta = SEED.meta;
  if (!S.classes[S.cur]) S.cur = null;
  saveCache();
}
